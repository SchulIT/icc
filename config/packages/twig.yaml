twig:
    paths:
        '%kernel.project_dir%/templates': ~
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'

    form_themes:
        - "form.html.twig"
    globals:
        config: '@SchulIT\CommonBundle\Twig\ConfigVariable'
        user: '@App\Infrastructure\Twig\UserVariable'
        profile_url: "%env(IDP_PROFILE_URL)%"
        dashboardSettings: '@App\Dashboard\Settings\DashboardSettings'
        servicecenter:
            enabled: '%env(bool:ROOM_STATUS)%'
            url: '%env(SERVICECENTER_URL)%'
            new_problem: '%env(SERVICECENTER_NEWPROBLEM_PATH)%'
